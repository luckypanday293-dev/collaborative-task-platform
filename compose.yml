services:
  postgres:
    image: postgres:17-alpine
    environment:
      POSTGRES_DB: collab_tasks
      POSTGRES_USER: collab
      POSTGRES_PASSWORD: collab
    ports:
      - "5432:5432"
    volumes:
      - collab_postgres_data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U collab -d collab_tasks"]
      interval: 5s
      timeout: 3s
      retries: 10

volumes:
  collab_postgres_data:
