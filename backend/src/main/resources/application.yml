spring:
  datasource:
    url: ${DB_URL:jdbc:postgresql://localhost:5432/collab_tasks}
    username: ${DB_USERNAME:collab}
    password: ${DB_PASSWORD:collab}
  jpa:
    hibernate:
      ddl-auto: update
    open-in-view: false
    properties:
      hibernate:
        format_sql: true
  jackson:
    serialization:
      write-dates-as-timestamps: false

server:
  port: ${PORT:8080}

app:
  cors-origin: ${CORS_ORIGIN:http://localhost:5173}
